<style>

*{box-sizing:border-box}
body{margin:0;font:17px/1.55 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(135deg,#073B47,#0B6E80);color:#fff;padding:22px 16px}
header .in,main{max-width:900px;margin:0 auto}
header small{letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-size:12px}
header h1{margin:4px 0 2px;font-size:26px;line-height:1.2}
header p{margin:0;opacity:.85;font-size:15px}
main{padding:16px}
a{color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:12px;padding:12px 14px}
.mcard:hover{background:var(--tint)}
.mcard b{color:var(--orange);font-size:14px}
.mcard span{display:block;font-size:15px;line-height:1.35;margin-top:2px}
.back{display:inline-block;margin:4px 0 8px;text-decoration:none;font-size:15px}
h2{font-size:22px;line-height:1.3;margin:6px 0 4px;color:var(--teal)}
.tag{color:var(--orange);font-weight:600;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:4px;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.tabs button.on{color:#0E1A1F}}
.box{background:var(--tint);border-radius:12px;padding:12px 16px;margin:10px 0}
ol,ul{padding-left:22px}li{margin:6px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.q h4{margin:0 0 8px;font-size:17px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer}
.opt:hover:not([disabled]){background:var(--tint)}
.opt.ok{background:var(--greenT);border-color:var(--green)}
.opt.no{background:var(--redT);border-color:var(--red)}
.score{font-size:20px;font-weight:700;text-align:center;padding:14px;border-radius:12px;background:var(--hot);margin:14px 0}
.btn{font:inherit;border:0;background:var(--orange);color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#0E1A1F}}
.fc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{min-height:96px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.card .t{font-weight:700;color:var(--teal);font-size:18px}
.card .d{font-size:15px}
.card.flip{background:var(--hot)}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px}
.formula{border:1px solid var(--line);border-left:6px solid var(--orange);border-radius:12px;padding:10px 14px;margin:12px 0;background:var(--card)}
.formula b{color:var(--orange)}
.formula .f{font-size:22px;font-weight:700;margin:4px 0;font-family:Georgia,"Times New Roman",serif}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:600}
details .sol{margin-top:8px;padding:8px 12px;background:var(--greenT);border-radius:8px}
.sim{background:var(--greenT);border-radius:12px;padding:12px 16px;margin:10px 0}
footer{max-width:900px;margin:30px auto 20px;padding:0 16px;color:var(--muted);font-size:14px}

header{position:relative;overflow:hidden;background:linear-gradient(135deg,#052F3A,#0B6E80)}
header .in{position:relative}
header .mol{position:absolute;right:0;top:0;height:100%;opacity:.16;pointer-events:none}
.strip{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.tl{position:relative;width:42px;height:42px;border-radius:8px;border:1.5px solid rgba(255,255,255,.45);display:inline-flex;align-items:flex-end;justify-content:flex-start;padding:0 0 3px 6px;font-weight:700;font-size:17px;color:#fff;background:rgba(255,255,255,.08)}
.tl i{position:absolute;top:2px;left:5px;font-style:normal;font-size:9px;font-weight:600;opacity:.85}
.tl3{background:#C2410C;border-color:#C2410C}
.tl2{background:rgba(255,255,255,.2)}
body{background-image:radial-gradient(circle at 1px 1px,rgba(11,110,128,.07) 1px,transparent 0);background-size:22px 22px}
.mcard{position:relative;display:flex;gap:12px;align-items:center;border-left-width:1px}
.el{flex:0 0 58px;height:58px;border-radius:10px;border:2px solid var(--c,var(--teal));background:var(--card);position:relative;display:flex;align-items:flex-end;justify-content:center;font-weight:800;font-size:24px;color:var(--c,var(--teal));padding-bottom:3px}
.el i{position:absolute;top:3px;left:6px;font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.mcard .tx{display:block;min-width:0}
.mcard .tx b{display:block}
.mcard .tx span{display:block;font-size:15px;line-height:1.35;margin-top:2px}
.mcard:hover .el{background:var(--c,var(--teal));color:#fff}
.mcard:hover .el i{color:#fff}
.chead{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#073B47,#0B6E80);color:#fff;border-radius:14px;padding:14px 16px;margin:6px 0 4px}
.chead .el{flex:0 0 72px;height:72px;font-size:32px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7);color:#fff}
.chead .el i{color:#fff;opacity:.85}
.chead h2{color:#fff;margin:2px 0 0;font-size:20px}
.chead .tag{color:#FFB27A}
.tabs button{display:inline-flex;gap:6px;align-items:center}
.tabs svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.q h4{display:flex;gap:10px}
.q h4 .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:dark){.q h4 .n{color:#0E1A1F}.tl2{background:rgba(255,255,255,.2)}}
h3{color:var(--deep,var(--teal));border-bottom:2px solid var(--tint);padding-bottom:4px}
.formula .f{background:var(--tint);border-radius:8px;padding:6px 12px;display:inline-block}
footer{border-top:2px solid var(--tint);padding-top:12px}
@media (max-width:480px){.el{flex-basis:52px;height:52px;font-size:21px}.chead .el{flex-basis:60px;height:60px}}
.mcard .el{display:flex;margin-top:0;font-size:24px;line-height:1}
.mcard .tx>span{display:block}
@media (max-width:480px){.mcard .el{font-size:21px}}
[hidden]{display:none!important}
.bar{height:12px;background:var(--tint);border-radius:999px;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-top:10px}
.badge{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--hot);color:var(--orange)}
.badge.g{background:var(--greenT);color:var(--green)}
.big{text-align:center;border-radius:14px;padding:18px;background:var(--hot);margin:10px 0}
.big .p{font-size:44px;font-weight:800;color:var(--orange);line-height:1.1}
.big .l{font-size:19px;font-weight:700}
.mk{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.mk button,.sm{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.mk button.on.y{background:var(--greenT);border-color:var(--green);color:var(--green);font-weight:700}
.mk button.on.n{background:var(--redT);border-color:var(--red);color:var(--red);font-weight:700}
.card.k{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.card.r{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.card{flex-direction:column;gap:8px}
li.rv label{cursor:pointer;display:block}
li.rv input{margin-right:8px;transform:scale(1.2)}
.note{font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;width:100%;max-width:360px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0 8px}
.card{display:block;text-align:center;min-height:96px}
.card .tt{font-weight:700;color:var(--teal);font-size:18px;display:block;padding:20px 4px}
.card .tn{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.card .td{display:block;font-size:15px;line-height:1.45}
.card .mk{justify-content:center}
</style>

 reaksiya tenglamasini tenglashtirishning asosi hisoblanadi? Yadro reaksiyalarida bu qonun qanday o'zgaradi?"],"test":[{"q":"Kimyo nimani o'rganadi?","o":["Faqat jismlarning harakatini","Moddalar, ularning tarkibi, tuzilishi, xossalari va aylanishlarini","Faqat tirik organizmlarni","Faqat metallarni"],"a":1},{"q":"Massaning saqlanish qonunini tajribada kimlar isbotlagan?","o":["Dalton va Avogadro","Mendeleyev va Bor","Lomonosov va Lavuazye","Boyl va Paratsels"],"a":2},{"q":"Elementlar davriy qonuni qaysi yilda kashf etilgan?","o":["1869","1748","1803","1913"],"a":0},{"q":"Suvda vodorod va kislorodning massa nisbati taxminan qancha?","o":["1 : 1","2 : 1","8 : 1","1 : 8"],"a":3},{"q":"Quyidagilardan qaysi biri sodda modda?","o":["CO~2~","NaCl","H~2~O","O~3~"],"a":3},{"q":"Kimyoviy reaksiya sodir bo'lganining eng ishonchli mezoni qaysi?","o":["Rang o'zgarishi","Yangi modda hosil bo'lishi","Hajm o'zgarishi","Harorat o'zgarishi"],"a":1},{"q":"Gaber–Bosh jarayonida nima olinadi?","o":["Ammiak","Sulfat kislota","Soda","Polietilen"],"a":0},{"q":"Yashil kimyoning maqsadi nima?","o":["Faqat yashil bo'yoq ishlab chiqarish","Kimyoviy reaksiyalarni to'xtatish","Chiqindi va xavfni kamaytiradigan, resursni tejaydigan jarayonlar yaratish","Faqat o'simlik moddalarini o'rganish"],"a":2}],"glossary":[["Kimyo","Moddalar, ularning tarkibi, tuzilishi, xossalari va aylanishlarini o'rganuvchi tabiiy fan."],["Modda","Massaga ega bo'lgan va fazoning ma'lum qismini egallaydigan materiya turi."],["Kimyoviy element","Yadro zaryadi bir xil bo'lgan atomlarning muayyan turi."],["Sodda modda","Bitta kimyoviy element atomlaridan tuzilgan modda (Fe, O~2~, S~8~)."],["Murakkab modda","Turli element atomlaridan tuzilgan modda, birikma (H~2~O, CO~2~, NaCl)."],["Aralashma","Ikki yoki undan ortiq toza moddadan iborat, tarkibi o'zgaruvchan sistema."],["Fizik hodisa","Modda tarkibi o'zgarmay, faqat shakli yoki agregat holati o'zgaradigan hodisa."],["Kimyoviy reaksiya","Bir moddalardan yangi tarkib va xossali boshqa moddalar hosil bo'lishi."],["Alkimyo","III–XVI asrlardagi, metallarni o'zgartirishga urinib, tajriba usullarini shakllantirgan davr."],["Massaning saqlanish qonuni","Reaksiyaga kirishgan moddalar massasi mahsulotlar massasiga teng."],["Allotropiya","Bitta element bir nechta sodda modda hosil qilishi (O~2~ va O~3~, olmos va grafit)."],["Yashil kimyo","Chiqindi va xavfni kamaytiradigan, resursni tejaydigan kimyoviy jarayonlar yaratish yo'nalishi."],["Kimyoviy hodisa","Moddalarning yangi moddalarga aylanishi bilan boradigan jarayon."],["Toza modda","Tarkibi va xossalari butun hajmda bir xil bo'lgan modda."],["Gomogen aralashma","Tarkibiy qismlarini oddiy ko'z bilan farqlab bo'lmaydigan aralashma."],["Agregat holat","Moddaning qattiq, suyuq yoki gaz holati."]],"problems":["36 g suvda necha mol modda va necha molekula bor? (N~A~ = 6,02·10^23^ mol^-1^)","Ammiak sintezida 56 g azot to'liq reaksiyaga kirishdi: N~2~ + 3H~2~ → 2NH~3~. Hosil bo'lgan ammiakning massasini va normal sharoitdagi hajmini toping.","Reaksiya tenglamasini tenglashtiring: Al + O~2~ → Al~2~O~3~.","Tabiiy gazning asosiy qismi metandir. 80 g metan normal sharoitda qancha hajm egallaydi?","32 g metan to'liq yonishi uchun qancha massa kislorod kerak va qancha massa CO~2~ hosil bo'ladi? (CH~4~ + 2O~2~ → CO~2~ + 2H~2~O)","Suv (H~2~O) tarkibidagi vodorod va kislorodning massa ulushlarini (%) hisoblang."],"solutions":["1)  n = 36 : 18 = 2 mol;  N = 2 · 6,02·10^23^ = 1,204·10^24^ ta molekula.","2)  56 g N~2~ = 2 mol, NH~3~ = 4 mol → m = 4 · 17 = 68 g;  V = 4 · 22,4 = 89,6 l.","3)  4Al + 3O~2~ → 2Al~2~O~3~","4)  n = 80 : 16 = 5 mol;  V = 5 · 22,4 = 112 l.","5)  n(CH~4~) = 2 mol → O~2~: 4 mol = 128 g;  CO~2~: 2 mol = 88 g.","6)  w(H) = 2/18 = 11,1 %;  w(O) = 16/18 = 88,9 %."],"eq":["a)  4Fe + 3O~2~ → 2Fe~2~O~3~","b)  CH~4~ + 2O~2~ → CO~2~ + 2H~2~O"],"homework":["Konspektdagi 1.1–1.6 bo'limlarni qayta o'qing va 10 ta asosiy atamani o'z so'zlaringiz bilan yozing.","Elektron sahifadagi «Amaliy topshiriqlar» bo'limidan 1, 3 va 5-masalani daftarda to'liq yechib keling.","Elektron sahifadagi yuqori darajali savollardan birini tanlab, 1 sahifalik qisqa javob tayyorlang.","Mustaqil: o'zbek kimyogarlaridan biri (masalan, Beruniy, Ibn Sino yoki zamonaviy olim) haqida 5 jumlalik axborot tayyorlang."],"project":"Uyingizdagi uchta mahsulotning (masalan, tish pastasi, ichimlik, kosmetik vosita) yorlig'ini o'qing. Tarkibidagi kamida 5 ta kimyoviy moddani yozing va ularning vazifasini aniqlashga harakat qiling. Natijani bir sahifada rasmiylashtiring va guruhdoshlaringiz bilan solishtiring.","formulas":[{"n":"Modda miqdori","f":"n = m / M","d":"n — modda miqdori (mol), m — massa (g), M — molyar massa (g/mol)."},{"n":"Zarrachalar soni","f":"N = n · N~A~","d":"N~A~ = 6,02·10^23^ mol^-1^ — Avogadro doimiysi."},{"n":"Gaz hajmi (n.sh.)","f":"V = n · V~m~","d":"V~m~ = 22,4 l/mol — normal sharoitdagi molyar hajm (0 °C, 101,3 kPa)."},{"n":"Massa ulushi","f":"w(E) = n · A~r~(E) / M~r~ · 100 %","d":"n — formuladagi E atomlari soni, A~r~ — nisbiy atom massa, M~r~ — nisbiy molekulyar massa."},{"n":"Massaning saqlanish qonuni","f":"Σm(reagentlar) = Σm(mahsulotlar)","d":"Reaksiyada atomlar yo‘qolmaydi va hosil bo‘lmaydi, faqat qayta guruhlanadi."},{"n":"Suvning tarkibi","f":"m(H) : m(O) = 1 : 8","d":"H~2~O: 2 · 1 = 2 va 16, ya’ni 2 : 16 = 1 : 8. Tarkibning doimiylik qonuniga misol."},{"n":"Molekulyar massa","f":"M~r~ = Σ A~r~","d":"Masalan, M~r~(H~2~O) = 2 · 1 + 16 = 18."}],"sim":{"slug":"balancing-chemical-equations","title":"Kimyoviy reaksiyalarni tenglashtirish","task":"Tenglamaning ikkala tomonida atomlar soni tenglashganda «tabassum» chiqadi. 4 ta reaksiyani tenglashtirib, koeffitsiyentlarini daftarga yozing.","url":"https://phet.colorado.edu/sims/html/balancing-chemical-equations/latest/balancing-chemical-equations_uz.html","lang":"uz"}},{"no":2,"title":"Anorganik birikmalarning asosiy sinflari va ularning sanoatda qo'llanilishi","tag":"Ma'ruza  ·  2 soat","terms":"oksid, amfoterlik, asos, ishqor, kislota, asosliligi, tuz, neytrallanish reaksiyasi, genetik bog'lanish, kontakt usuli, indikator","outcomes":["anorganik moddalarni sodda va murakkab moddalarga, murakkablarini esa to'rt sinfga ajratasiz;","oksid, asos, kislota va tuzlarning nomlanishi va formulalarini to'g'ri yozasiz;","har bir sinfning asosiy kimyoviy xossalarini reaksiya tenglamalari bilan ifodalaysiz;","moddalar orasidagi genetik bog'lanishni zanjir ko'rinishida tuzasiz;","sulfat kislota, ishqor va soda kabi mahsulotlarning sanoatda olinishini tushuntirasiz;","oddiy hisoblash masalalarini reaksiya tenglamasi bo'yicha yechasiz."],"review":["Anorganik moddalar qanday sinflarga bo'linadi? Har biriga formula misol keltiring.","Oksidlarning to'rt turini ayting va har biriga ikki misol yozing.","Amfoterlik nima? Al(OH)~3~ ning kislota va ishqor bilan reaksiyalarini yozing.","Asos va ishqor tushunchalarining farqi nimada? Misollar keltiring.","Kislotalarning asosliligi nima? H~3~PO~4~ va H~2~SO~4~ asosliligini aytib bering.","Nima uchun SO~3~ suvda emas, konsentrlangan sulfat kislotada yutiladi?","Tuzlarning turlarini ayting va nordon tuzga misol yozing.","Genetik bog'lanish nima? Mis uchun (Cu → CuO → CuSO~4~) zanjir tuzing.","Genetik bog'lanish nima? Misol bilan tushuntiring.","Amfoter birikmalarning xossalarini tushuntiring."],"hard":["Tabiiy gaz tarkibida CO~2~ va H~2~S borligi qurilmalar uchun nimaga xavfli? Ularni gazdan ajratishda qaysi sinf moddalaridan (kislota yoki asos) foydalanish samarali va nima uchun?","Klaus jarayonida H~2~S ning faqat bir qismi SO~2~ gacha yoqiladi. Bu qismning kattaligi qanday aniqlanadi? Reaksiya tenglamasi asosida izohlang.","Nima uchun sulfat kislota ishlab chiqarishda oksidlash bosqichi (2SO~2~ + O~2~ → 2SO~3~) o'rtacha haroratda va katalizator ishtirokida olib boriladi? Reaksiyaning qaytarligini hisobga oling.","Xlor-ishqor elektrolizida NaOH, H~2~ va Cl~2~ birgalikda olinadi. Bu uch mahsulotning har biri qaysi sanoat tarmoqlari uchun xomashyo bo'lishi mumkin?"],"test":[{"q":"Quyidagilardan qaysi biri asosli oksid?","o":["CO~2~","CaO","SO~3~","P~2~O~5~"],"a":1},{"q":"Amfoter gidroksid qaysi?","o":["NaOH","Ca(OH)~2~","Al(OH)~3~","KOH"],"a":2},{"q":"H~3~PO~4~ kislotasining asosliligi nechaga teng?","o":["1","2","3","4"],"a":2},{"q":"Sulfat kislotani kontakt usulida olishda qaysi katalizator ishlatiladi?","o":["Fe","V~2~O~5~","MnO~2~","Al~2~O~3~"],"a":1},{"q":"Quyidagilardan qaysi biri ishqor?","o":["Cu(OH)~2~","Fe(OH)~3~","KOH","Zn(OH)~2~"],"a":2},{"q":"Qaysi birikma nordon tuz hisoblanadi?","o":["NaCl","NaHCO~3~","CaCO~3~","Na~2~SO~4~"],"a":1},{"q":"Ohaktoshni qizdirganda nima hosil bo'ladi?","o":["Ca(OH)~2~ va CO~2~","CaO va CO~2~","CaO va H~2~O","Ca va CO~2~"],"a":1},{"q":"Osh tuzining suvli eritmasi elektroliz qilinganda nimalar olinadi?","o":["NaOH, H~2~ va Cl~2~","Na va O~2~","Na~2~CO~3~","HCl va O~2~"],"a":0}],"glossary":[["Oksid","Ikki elementdan tuzilgan, ulardan biri kislorod (−2) bo'lgan murakkab modda."],["Amfoterlik","Moddaning ham kislota, ham asos bilan reaksiyaga kirishish xossasi (Al~2~O~3~, Al(OH)~3~)."],["Asos","Metall atomi va gidroksid guruhi (OH) dan tuzilgan murakkab modda."],["Ishqor","Suvda eriydigan asos (NaOH, KOH, Ba(OH)~2~)."],["Kislota","Metallga almashina oladigan vodorod atomlari va kislota qoldig'idan tuzilgan modda."],["Asosliligi","Kislota molekulasidagi metallga almashina oladigan vodorod atomlari soni."],["Tuz","Metall (yoki NH~4~^+^) va kislota qoldig'idan tuzilgan murakkab modda."],["Neytrallanish","Kislota va asosning o'zaro ta'sirida tuz va suv hosil bo'lishi."],["Genetik bog'lanish","Moddalar sinflari orasida bir-biriga o'tish mumkinligini ko'rsatuvchi bog'lanish."],["Kontakt usuli","Sulfat kislotani katalizator ishtirokida SO~2~ ni SO~3~ ga oksidlab olish usuli."],["Indikator","Muhitning kislotali yoki ishqoriy ekanini rangi o'zgarishi bilan ko'rsatuvchi modda."],["Gidroksid","Tarkibida OH guruhi bo'lgan birikma; asos yoki amfoter bo'lishi mumkin."],["Kislotali oksid","Suv bilan kislota hosil qiladigan yoki asos bilan tuz hosil qiladigan oksid."],["Asosli oksid","Kislota bilan tuz hosil qiladigan, odatda metall oksidi."],["Nordon tuz","Kislotadagi vodorodning bir qismi metallga almashgan tuz."]],"problems":["5,6 g kalsiy oksid suv bilan reaksiyaga kirishdi: CaO + H~2~O → Ca(OH)~2~. Hosil bo'lgan kalsiy gidroksidning massasini toping. (M(CaO) = 56 g/mol, M(Ca(OH)~2~) = 74 g/mol)","49 g sulfat kislotani to'liq neytrallash uchun necha gramm natriy gidroksid kerak? (H~2~SO~4~ + 2NaOH → Na~2~SO~4~ + 2H~2~O)","13 g rux xlorid kislota bilan reaksiyaga kirishdi: Zn + 2HCl → ZnCl~2~ + H~2~. Normal sharoitda ajralgan vodorodning hajmini toping.","20 g osh tuzi 80 g suvda eritildi. Eritmadagi tuzning massa ulushini (%) hisoblang.","Kontakt usulida 64 kg SO~2~ to'liq SO~3~ ga oksidlandi: 2SO~2~ + O~2~ → 2SO~3~. Hosil bo'lgan SO~3~ massasini va sarflangan kislorodning massasini toping.","Klaus jarayonida 68 g vodorod sulfid reaksiyaga kirishdi: 2H~2~S + SO~2~ → 3S + 2H~2~O. Hosil bo'lgan oltingugurt massasini toping."],"solutions":["1)  n(CaO) = 5,6 : 56 = 0,1 mol → n(Ca(OH)~2~) = 0,1 mol;  m = 0,1 · 74 = 7,4 g.","2)  n(H~2~SO~4~) = 49 : 98 = 0,5 mol → n(NaOH) = 1 mol;  m = 1 · 40 = 40 g.","3)  n(Zn) = 13 : 65 = 0,2 mol → n(H~2~) = 0,2 mol;  V = 0,2 · 22,4 = 4,48 l.","4)  w = 20 : (20 + 80) · 100 % = 20 %.","5)  64 kg SO~2~ = 1 kmol → SO~3~: 1 kmol = 80 kg;  O~2~: 0,5 kmol = 16 kg.","6)  n(H~2~S) = 68 : 34 = 2 mol → n(S) = 3 mol;  m = 3 · 32 = 96 g."],"eq":["a)  Na~2~O + H~2~O → 2NaOH","b)  Al~2~O~3~ + 6HCl → 2AlCl~3~ + 3H~2~O","c)  2Fe(OH)~3~ → Fe~2~O~3~ + 3H~2~O"],"homework":["2.1–2.6 bo'limlardagi har bir sinf uchun bittadan o'zingiz tanlagan misol keltiring va ularning formula hamda nomini daftarga yozing.","Elektron sahifadagi «Amaliy topshiriqlar» bo'limidan 1, 2 va 5-masalani daftarda to'liq yechib keling.","Cu → CuO → CuSO~4~ → Cu(OH)~2~ → CuO zanjirining reaksiya tenglamalarini yozing.","Mustaqil: sanoatda sulfat kislota yoki sodaning ishlatilish sohalari haqida 5 jumlalik axborot tayyorlang."],"project":"Uyingizdagi beshta mahsulotning (masalan, sirka, soda, osh tuzi, sovun, limon) har birini qaysi sinfga (kislota, asos, tuz yoki boshqa) mansubligini aniqlang va formulasini toping. Natijani jadval ko'rinishida rasmiylashtiring. Qizil karam indikatori bilan ularning kislotali yoki ishqoriy ekanini tekshiring.","formulas":[{"n":"Asosli oksid + kislota","f":"CaO + 2HCl → CaCl~2~ + H~2~O","d":"Asosli oksid kislota bilan tuz va suv hosil qiladi."},{"n":"Kislotali oksid + ishqor","f":"CO~2~ + 2NaOH → Na~2~CO~3~ + H~2~O","d":"Kislotali oksid ishqor bilan tuz va suv hosil qiladi."},{"n":"Neytrallanish","f":"NaOH + HCl → NaCl + H~2~O","d":"Asos va kislota o‘zaro ta’sirlashib tuz va suv beradi."},{"n":"Amfoter gidroksid (kislota bilan)","f":"Al(OH)~3~ + 3HCl → AlCl~3~ + 3H~2~O","d":"Amfoter modda kislotalarda asos kabi namoyon bo‘ladi."},{"n":"Amfoter gidroksid (ishqor bilan)","f":"Al(OH)~3~ + NaOH → Na[Al(OH)~4~]","d":"Ishqorda kislota kabi namoyon bo‘ladi, kompleks tuz hosil bo‘ladi."},{"n":"Xlor-ishqor elektrolizi","f":"2NaCl + 2H~2~O → 2NaOH + H~2~↑ + Cl~2~↑","d":"Osh tuzi eritmasi elektrolizi: ishqor, vodorod va xlor olinadi."}],"sim":null},{"no":3,"title":"Atom tuzilishi nazariyasi. Atomning tarkibiy qismlari va elektron qobiqlari","tag":"Ma'ruza  ·  2 soat","terms":"atom, yadro, proton, neytron, elektron, tartib raqam, massa soni, izotop, energetik sath, orbital, kvant soni, elektron konfiguratsiya","outcomes":["atom haqidagi tasavvurlarning rivojini va asosiy modellarni (Dalton, Tomson, Rezerford, Bor) izohlaysiz;","atomning tarkibiy qismlari — proton, neytron va elektronning zaryadi va massasini bilasiz;","atom tarkibidagi zarralar sonini (Z, N, A) aniqlaysiz va izotoplarni tushuntirasiz;","Bor modeli va atom spektrlari orasidagi bog'lanishni tushuntirasiz;","elektronning zarra va to'lqin tabiatini hamda orbital tushunchasini izohlaysiz;","kvant sonlari va Pauli, Xund, Klechkovskiy qoidalari asosida elektron konfiguratsiyani yozasiz."],"review":["Rezerford tajribasining mazmunini va undan chiqqan xulosani tushuntiring.","Atomning asosiy zarralarini va ularning zaryadi hamda massasini sanang.","Tartib raqam, massa soni va neytronlar soni qanday bog'langan?","Izotoplar nima? Vodorod izotoplariga misol keltiring.","Bor modelining asosiy postulatlarini ayting va kamchiligini ko'rsating.","De Broyl g'oyasi va Geyzenberg noaniqlik prinsipining ma'nosi nimada?","To'rtta kvant sonining nomini va qiymatlarini ayting.","Pauli prinsipi, Xund qoidasi va Klechkovskiy qoidasini ta'riflang.","Elektron konfiguratsiyani yozish qoidalarini (Pauli, Gund, minimal energiya) ayting.","Kvant sonlari nimani bildiradi?"],"hard":["Nima uchun Bor modeli ko'p elektronli atomlar uchun yaramaydi? Kvant-mexanik modelning qanday afzalligi bor?","Spektral tahlil gaz tarkibini aniqlashda qanday ishlaydi? Atom spektrining «barmoq izi» deyilishini izohlang.","Nima uchun geliy (1s^2^) va neon (1s^2^2s^2^2p^6^) kimyoviy jihatdan inert? Bu ma'lumot sanoatda ularning qo'llanilishiga qanday ta'sir qiladi?","Xrom va misda elektron konfiguratsiyaning «chetga chiqishi»ni yarim va to'liq to'lgan pog'onalar barqarorligi bilan izohlang."],"test":[{"q":"Elementning tartib raqami nimani ko'rsatadi?","o":["Neytronlar sonini","Yadrodagi protonlar sonini","Massa sonini","Valent elektronlar sonini"],"a":1},{"q":"Atom yadrosini kim kashf etdi?","o":["Dalton","Tomson","Rezerford","Bor"],"a":2},{"q":"^37^Cl atomida nechta neytron bor? (Z = 17)","o":["17","18","37","20"],"a":3},{"q":"Izotoplar — bu atomlar:","o":["protonlar soni bir xil, neytronlar soni har xil","neytronlar soni bir xil, protonlar soni har xil","massa soni har xil, elektronlar soni bir xil","elektronlar soni har xil, protonlar soni bir xil"],"a":0},{"q":"p-pog'onada nechta orbital bor?","o":["1","2","3","5"],"a":2},{"q":"Pauli prinsipiga ko'ra:","o":["elektronlar avval bo'sh orbitallarni bittadan to'ldiradi","bir orbitalda ko'pi bilan 2 elektron bo'lad a 3 tadan misol topib, jadval ko'rinishida yozing."],"project":"Oshxonada yoki uyda kinetikaga doir bir tajriba o'ylab toping (masalan, turli haroratdagi suvda shakar yoki shipuvchi tabletkaning erish vaqti). Uch xil haroratda vaqtni o'lchang, natijalarni jadvalga kiriting va grafik chizing. Tezlik haroratga qanday bog'liq degan xulosa chiqaring.","formulas":[{"n":"Reaksiya tezligi","f":"v = ± Δc / Δt","d":"Konsentratsiyaning vaqt birligida o‘zgarishi: mahsulot uchun «+», reagent uchun «−»."},{"n":"Massalar ta’siri qonuni","f":"v = k · [A]^a^ · [B]^b^","d":"k — tezlik doimiysi, [A], [B] — konsentratsiyalar (mol/l), a, b — darajalar (elementar reaksiyada koeffitsiyentlarga teng). Qattiq moddalar kirmaydi."},{"n":"Vant-Goff qoidasi","f":"v₂ / v₁ = γ^(t₂ − t₁)/10^","d":"γ — tezlikning harorat koeffitsiyenti (odatda 2–4): harorat har 10 °C ga oshganda tezlik γ marta oshadi."},{"n":"Arrenius bog‘liqligi","f":"k = A · e^−Eₐ/RT^","d":"E~a~ — aktivlanish energiyasi, R = 8,314 J/(mol·K), T — absolyut harorat (K)."}],"sim":{"slug":"reactions-and-rates","title":"Reaksiya tezligi","task":"Harorat va konsentratsiyani o‘zgartirib, to‘qnashuvlar soni va reaksiya tezligi qanday o‘zgarishini kuzating.","url":"https://phet.colorado.edu/ru/simulations/reactions-and-rates","lang":"ru"}},{"no":8,"title":"Kimyoviy muvozanat. Qaytar va qaytmas reaksiyalar. Le Shatelye prinsipi","tag":"Ma'ruza  ·  2 soat","terms":"qaytar reaksiya, qaytmas reaksiya, kimyoviy muvozanat, dinamik muvozanat, muvozanat konstantasi, muvozanat siljishi, Le Shatelye prinsipi, mahsulot unumi","outcomes":["qaytar va qaytmas reaksiyalarni farqlaysiz;","dinamik kimyoviy muvozanat mohiyatini tushuntirasiz;","muvozanat konstantasi ifodasini yozasiz va undan hisoblashlarda foydalanasiz;","Le Shatelye prinsipi bo'yicha muvozanat siljish yo'nalishini aniqlaysiz;","konsentratsiya, bosim, harorat va katalizatorning muvozanatga ta'sirini izohlaysiz;","ammiak va sulfat kislota ishlab chiqarish sharoitlarini asoslaysiz."],"revie  mol/l. K ni va SO~2~ hamda O~2~ ning boshlang'ich konsentratsiyalarini toping.","2HI ⇌ H~2~ + I~2~. HI ning boshlang'ich konsentratsiyasi 1 mol/l; 20 % HI parchalanganda K ni toping.","N~2~O~4~(g) ⇌ 2NO~2~(g), ΔH > 0. Quyidagi ta'sirlardan qaysilari NO~2~ unumini oshiradi: a) bosimni oshirish; b) haroratni oshirish; d) bosimni kamaytirish?"],"solutions":["1)  K = [NH~3~]^2^ / ([N~2~][H~2~]^3^) = 1,0^2^ / (0,5 · 1,5^3^) = 1 / 1,6875 ≈ 0,59.","2)  K = 1,6^2^ / (0,2 · 0,2) = 2,56 / 0,04 = 64.","3)  Reaksiyaga kirgan x mol/l: x^2^ / (1 − x)^2^ = 1 → x = 0,5. Muvozanatda: [A] = [B] = [C] = [D] = 0,5 mol/l.","4)  K = 0,4^2^ / (0,2^2^ · 0,1) = 0,16 / 0,004 = 40.  Boshlang'ich: [SO~2~] = 0,2 + 0,4 = 0,6; [O~2~] = 0,1 + 0,2 = 0,3 mol/l.","5)  Muvozanatda [HI] = 0,8; [H~2~] = [I~2~] = 0,1. K = 0,1 · 0,1 / 0,8^2^ = 0,01 / 0,64 ≈ 0,016.","6)  Javob: b) va d). Reaksiya endotermik, shuning uchun harorat ↑ muvozanatni o'ngga siljitadi. Gaz mollari 1 → 2 ortadi, shuning uchun bosimni kamaytirish ham o'ngga siljitadi; bosimni oshirish esa chapga siljitadi."],"eq":["2NO~2~ ⇌ N~2~O~4~, ΔH < 0: bosim oshirilsa — o'ngga (mollar 2 → 1); harorat oshirilsa — chapga (ekzotermik reaksiya teskari yo'nalishga)."],"homework":["8.1–8.6 bo'limlardagi asosiy atamalarni (kamida 10 ta) o'z so'zlaringiz bilan yozing.","Elektron sahifadagi «Amaliy topshiriqlar» bo'limidan 1, 4 va 5-masalani daftarda to'liq yechib keling.","Metanol sintezi (CO + 2H~2~ ⇌ CH~3~OH, ΔH < 0) uchun sanoat sharoitlarini Le Shatelye prinsipi asosida izohlang.","Mustaqil: kundalik hayotda muvozanat siljishiga 2 ta misol toping (masalan, gazlangan ichimlik shishasini ochish)."],"project":"Biror sanoat jarayonini (masalan, ammiak, sulfat kislota yoki metanol sintezi) tanlang va uning sharoitlarini (harorat, bosim, katalizator) Le Shatelye prinsipi nuqtai nazaridan tushuntiruvchi bir sahifalik plakat tayyorlang. Plakatda reaksiya tenglamasi, K ifodasi va sharoitlar jadvali bo'lsin.","formulas":[{"n":"Muvozanat doimiysi","f":"K = otali yoki ishqoriyligi ko'rsatkichi."],["Ion almashinish reaksiyasi","Eritmada ionlar almashinishi bilan boradigan reaksiya."],["Neytral muhit","Vodorod ko'rsatkichi 25 °C da pH = 7 bo'lgan muhit."],["Arrenius nazariyasi","Elektrolitlar suvda ionlarga dissotsiatsiyalanishini tushuntiruvchi nazariya."]],"problems":["0,1 M Al~2~(SO~4~)~3~ eritmasida Al^3+^ va SO~4~^2−^ ionlari konsentratsiyasini toping (to'liq dissotsiatsiya).","0,01 M kuchsiz kislota eritmasida [H^+^] = 10^−4^ mol/l. Dissotsiatsiya darajasini toping.","0,001 M HCl va 0,01 M NaOH eritmalarining pH qiymatlarini hisoblang.","CH~3~COOH uchun K = 1,8·10^−5^. 0,1 M eritmada α va pH ni hisoblang.","BaCl~2~ + Na~2~SO~4~ va Na~2~CO~3~ + HCl reaksiyalarining qisqartirilgan ionli tenglamalarini yozing.","Quyidagilardan qaysilari elektrolit, qaysilari noelektrolit: shakar, NaCl, etil spirt, HCl, CH~3~COOH, glyukoza?"],"solutions":["1)  Al~2~(SO~4~)~3~ → 2Al^3+^ + 3SO~4~^2−^: [Al^3+^] = 0,2 M;  [SO~4~^2−^] = 0,3 M.","2)  α = [H^+^] / C = 10^−4^ / 10^−2^ = 0,01 = 1 %.","3)  0,001 M HCl: pH = 3.  0,01 M NaOH: pOH = 2, pH = 14 − 2 = 12.","4)  α ≈ √(K/C) = √(1,8·10^−4^) ≈ 0,0134 (1,34 %);  [H^+^] = 0,1 · 0,0134 = 1,34·10^−3^;  pH = −lg(1,34·10^−3^) ≈ 2,87.","5)  Ba^2+^ + SO~4~^2−^ → BaSO~4~↓;   CO~3~^2−^ + 2H^+^ → H~2~O + CO~2~↑.","6)  Elektrolit: NaCl, HCl, CH~3~COOH (kuchsiz). Noelektrolit: shakar, etil spirt, glyukoza."],"eq":["Na~2~CO~3~ + 2HCl → 2NaCl + H~2~O + CO~2~↑;   2Na^+^ + CO~3~^2−^ + 2H^+^ + 2Cl^−^ → 2Na^+^ + 2Cl^−^ + H~2~O + CO~2~↑;   CO~3~^2−^ + 2H^+^ → H~2~O + CO~2~↑."],"homework":["11.1–11.6 bo'limlardagi asosiy atamalarni (kamida 10 ta) o'z so'zlaringiz bilan yozing.","Elektron sahifadagi «Amaliy topshiriqlar» bo'limidan 2, 3 va 4-masalani daftarda to'liq yechib keling.","H~3~PO~4~ ning bosqichma-bosqich dissotsiatsiya tenglamalarini yozing va qaysi bosqich eng kuchsiz ekanini tushuntiring.","Mustaqil: kundalik hayotdagi 6 ta eritmaning (limon suvi, sirka, soda, shampun va h.k.) pH ini topib, shkalada joylashtiring."],"project":"Uyda LED va batareyadan oddiy «elektr o'tkazuvchanlik sinagichi» yasang. Kamida 6 xil suyuqlikni (distillangan suv, vodoprovod suvi, tuz, shakar, sirka, soda eritmalari) sinab, natijalarni jadvalga kiriting va elektrolit/noelektrolit, kuchli/kuchsiz elektrolit deb tasniflang.","formulas":[{"n":"Dissotsilanish darajasi","f":"α = n(dissots.) / n(umumiy)","d":"Ionlarga ajralgan molekulalar ulushi (0 ≤ α ≤ 1 yoki foizda)."},{"n":"Dissotsilanish doimiysi","f":"K = [CH₃COO⁻]·[H⁺] / [CH₃COOH]","d":"Kuchsiz elektrolit (masalan, sirka kislota) uchun muvozanat doimiysi."},{"n":"Ostvaldning suyultirish qonuni","f":"K ≈ α² · C   yoki   α ≈ √(K / C)","d":"Kuchsiz elektrolitlar uchun (α ≪ 1). Suyultirilganda α ortadi."},{"n":"Vodorod ko‘rsatkichi","f":"pH = −lg [H⁺]","d":"pH < 7 — kislotali, pH = 7 — neytral (25 °C), pH > 7 — ishqoriy muhit."},{"n":"Gidroksid ko‘rsatkichi","f":"pOH = −lg [OH⁻];  pH + pOH = 14","d":"25 °C da suvli eritmalar uchun."},{"n":"Ionli tenglama","f":"Ba²⁺ + SO₄²⁻ → BaSO₄↓","d":"Qisqartirilgan ionli tenglama: BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2NaCl reaksiyasining mohiyati."}],"sim":{"slug":"ph-scale","title":"pH shkalasi","task":"Turli suyuqliklar (qahva, sut, xlorid kislota va boshqalar) pH qiymatini o‘lchang va ularni kislotali yoki ishqoriy deb tasniflang.","url":"https://phet.colorado.edu/sims/html/ph-scale/latest/ph-scale_uz.html","lang":"uz"}},{"no":12,"title":"Oksidlanish-qaytarilish reaksiyalari. Moddalarning oksidlanish-qaytarilish xossalarining elementlarning davriy sistemadagi o'rniga bog'liqligi","tag":"Ma'ruza  ·  2 soat","terms":"oksidlanish darajasi, oksidlovchi, qaytaruvchi, oksidlanish, qaytarilish, elektron balans, disproporsiyalanish, ichki molekulyar OQR, oksidlanish-qaytarilish juftligi","outcomes":["oksidlanish darajasini aniqlash qoidalarini qo'llaysiz;","oksidlovchi, qaytaruvchi, oksidlanish va qaytarilish jarayonlarini farqlaysiz;","oksidlanish-qaytarilish reaksiyalarining turlarini (molekulalararo, ichki, d // Yangi o'zbek lotin alifbosi (2026): sh→ş, ch→ç, oʻ→ö, gʻ→ğ; ng — n+g; tutuq belgisi ’ saqlanadi.
function NA(s) {
  if (typeof s !== 'string' || !s) return s;
  if (s.charCodeAt(0) === 1) return s.slice(1);          // belgilangan (xorijiy) matn — o'zgartirilmaydi
  const prot = /(\bChemCollective\b|https?:\/\/\S+|\b[\w-]+(?:\.[\w-]+)*\.(?:uz|ru|org|com|edu|gov|net|io)(?:\/[^\s)]*)?)/g;
  const conv = t => {
    const Q = "['‘’ʻʼ`´]";
    t = t.replace(new RegExp('([oOgG])' + Q, 'g'), (m, c) => ({ o: 'ö', O: 'Ö', g: 'ğ', G: 'Ğ' }[c]));
    t = t.replace(new RegExp('([A-Za-zöÖğĞşç])' + Q + '(?=[A-Za-zöÖğĞ])', 'g'), '$1’');
    t = t.replace(/sh/g, 'ş').replace(/Sh/g, 'Ş').replace(/ch/g, 'ç').replace(/Ch/g, 'Ç');
    t = t.replace(/\b[A-ZÖĞ]{5,}\b/g, w => /[AEIOUÖ]/.test(w) ? w.replace(/SH/g, 'Ş').replace(/CH/g, 'Ç') : w);
    return t;
  };
  let out = '', last = 0, m;
  while ((m = prot.exec(s))) { out += conv(s.slice(last, m.index)) + m[0]; last = m.index + m[0].length; }
  return out + conv(s.slice(last));
}

(function(){
  const SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,NOSCRIPT:1};
  let busy=false,obs=null;
  function run(root){
    busy=true;
    try{
      const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>SKIP[n.parentNode&&n.parentNode.nodeName]?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
      const arr=[];while(w.nextNode())arr.push(w.currentNode);
      arr.forEach(n=>{const v=NA(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;});
      root.querySelectorAll&&root.querySelectorAll('[title],[placeholder],[aria-label],[alt]').forEach(e=>['title','placeholder','aria-label','alt'].forEach(a=>{const v=e.getAttribute(a);if(v){const x=NA(v);if(x!==v)e.setAttribute(a,x);}}));
      const t=NA(document.title);if(t!==document.title)document.title=t;
    }finally{busy=false;}
  }
  let pend=false;
  function sched(){if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;run(document.body);});}
  document.addEventListener('DOMContentLoaded',()=>{run(document.body);obs=new MutationObserver(()=>{if(!busy)sched();});obs.observe(document.body,{childList:true,subtree:true,characterData:true});});
  if(document.readyState!=='loading'){run(document.body);}
})();</script>

  const back=(k,x,i)=>{k.className=cls(i)+' flip';k.dataset.open='1';
    k.innerHTML=`<div class="tn">${f(x[0])}</div><div class="td">${f(x[1])}</div><div class="mk"><button class="y">✔ Bilaman</button><button class="n">↻ Takrorlayman</button></div>`;
    k.querySelector('.y').onclick=e=>{e.stopPropagation();s.term[i]=1;save();front(k,x,i);cnt();};
    k.querySelector('.n').onclick=e=>{e.stopPropagation();s.term[i]=0;save();front(k,x,i);cnt();};};
  const draw=q=>{
    const g=c.glossary.map((x,i)=>[x,i]).filter(([x])=>(x[0]+' '+x[1]).toLowerCase().includes(q.toLowerCase()));
    const fc=document.getElementById('fc');fc.innerHTML='';
    if(!g.length){fc.innerHTML='<p>Topilmadi.</p>';return;}
    g.forEach(([x,i])=>{const k=document.createElement('div');front(k,x,i);
      k.onclick=()=>{k.dataset.open==='1'?front(k,x,i):back(k,x,i)};fc.appendChild(k);});
  };
  draw('');cnt();document.getElementById('s').oninput=e=>draw(e.target.value);
}
function formula(c,B){B.innerHTML=c.formulas.map(x=>`<div class="formula"><b>${f(x.n)}</b><div class="f">${f(x.f)}</div><div>${f(x.d)}</div></div>`).join('');}
function amaliy(c,B){
  const s=st(c.no);let h='';
  if(c.sim)h+=`<h3>Virtual laboratoriya</h3><div class="sim"><b>${f(c.sim.title)}</b> (PhET)<p>${f(c.sim.task)}</p><a class="btn" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="${c.sim.url}">Simulyatsiyani ochish (${c.sim.lang==='uz'?'o‘zbekcha':'ruscha'})</a>${c.sim.lang==='uz'?'':'<p class="note">Bu simulyatsiyaning o‘zbekcha varianti hozircha yo‘q, ruscha ochiladi.</p>'}</div>`;
  h+=`<h3>Masalalar</h3><p>Avval daftarda o‘zingiz yeching, keyin javobni oching va natijangizni belgilang. Bu natijangizga qo‘shiladi.</p>`+c.problems.map((p,i)=>`<details><summary>${i+1}-masala</summary><p>${f(p)}</p><div class="sol"><b>Javob:</b> ${f((c.solutions[i]||'').replace(/^\d+\)\s*/,''))}</div><div class="mk" data-i="${i}"><button class="y ${s.prob[i]===1?'on':''}">✔ To‘g‘ri yechdim</button><button class="n ${s.prob[i]===0?'on':''}">✘ Xato qildim</button></div></details>`).join('');
  if(c.eq.length)h+=`<h3>«Mustaqil bajaring» topshirig‘ining javobi</h3><details><summary>Javoblarni ko‘rish</summary>${c.eq.map(e=>`<p>${f(e)}</p>`).join('')}</details>`;
  h+=`<h3>Uy vazifasi</h3><ol>${c.homework.map(x=>`<li>${f(x)}</li>`).join('')}</ol><h3>Mini-loyiha</h3><div class="box">${f(c.project)}</div>`;
  B.innerHTML=h;
  B.querySelectorAll('.mk').forEach(m=>{const i=m.dataset.i,y=m.querySelector('.y'),n=m.querySelector('.n');
    y.onclick=()=>{s.prob[i]=1;save();y.classList.add('on');n.classList.remove('on')};
    n.onclick=()=>{s.prob[i]=0;save();n.classList.add('on');y.classList.remove('on')};});
}
function natija(c,B){
  const r=calc(c),g=grade(r.total);
  const weakest=Object.keys(W).filter(k=>r.comp[k].p<0.7).sort((a,b)=>r.comp[a].p-r.comp[b].p);
  B.innerHTML=`<div class="big"><div class="p">${r.total}%</div><div class="l">${g[0]}</div><div>${g[1]}</div>${r.done<4?`<p class="note">Bajarilgan bo‘limlar: ${r.done} / 4. Qolganlarini bajarsangiz, natija aniqroq bo‘ladi.</p>`:''}</div>
  <h3>Bo‘limlar bo‘yicha</h3>`+Object.keys(W).map(k=>{const x=r.comp[k],pc=Math.round(x.p*100);
    return `<div><div class="row"><b>${NAMES[k]} <span class="note">(${W[k]}%)</span></b><span>${x.done?pc+'%':'—'}</span></div><div class="bar"><i style="width:${pc}%"></i></div><div class="note">${x.txt}</div></div>`}).join('')+
  `<h3>Tavsiya</h3>`+(weakest.length?`<ul>${weakest.map(k=>`<li><b>${NAMES[k]}</b> bo‘limini ${r.comp[k].done?'qayta bajaring':'bajaring'} <button class="sm" data-go="${TABS[k]}">Ochish</button></li>`).join('')}</ul>`:'<p>Barcha bo‘limlar bo‘yicha natijangiz yaxshi. Keyingi mavzuga o‘ting.</p>')+
  `<p class="note">Baholash: Test 40%, Masalalar 30%, Nazorat savollari 20%, Atamalar 10%. 86–100% — «A’lo (5)», 71–85% — «Yaxshi (4)», 55–70% — «Qoniqarli (3)». Masala, savol va atamalar sizning o‘zingiz belgilagan javoblaringizga asoslanadi.</p>
  <h3>O‘qituvchiga yuborish</h3><div class="box"><label>F.I.Sh.<br><input type="text" id="nm" placeholder="Familiya Ism"></label><br><label>Guruh<br><input type="text" id="gr" placeholder="Masalan, KM-24"></label></div>
  ${ENDPOINT?'<button class="btn" id="snd" style="background:var(--green)">O‘qituvchiga yuborish</button> ':''}<button class="btn" id="cp">Natijani nusxalash</button> <button class="sm" id="rs">Mavzu natijasini tozalash</button><p class="note" id="msg"></p>`;
  B.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>chapter(c.no,b.dataset.go));
  const nm=document.getElementById('nm'),gr=document.getElementById('gr');
  nm.value=S.name||'';gr.value=S.group||'';
  const keep=()=>{S.name=nm.value.trim();S.group=gr.value.trim();save();};nm.oninput=keep;gr.oninput=keep;
  const snd=document.getElementById('snd');
  if(snd)snd.onclick=()=>{
    keep();const m=document.getElementById('msg');
    if(!S.name||!S.group){m.textContent='Avval F.I.Sh. va guruhni kiriting.';return;}
    if(r.done<1){m.textContent='Avval kamida bitta bo‘limni bajaring.';return;}
    const payload={name:S.name,group:S.group,mavzu:c.no,umumiy:r.total,baho:g[0],test:Math.round(r.comp.test.p*100),masalalar:Math.round(r.comp.prob.p*100),savollar:Math.round(r.comp.rev.p*100),atamalar:Math.round(r.comp.term.p*100),bajarilgan:r.done};
    snd.disabled=true;m.textContent='Yuborilmoqda...';
    fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .then(()=>{m.textContent='Natija o‘qituvchiga yuborildi. Rahmat!';snd.disabled=false;})
      .catch(()=>{m.textContent='Yuborib bo‘lmadi. Internetni tekshirib, qayta urinib ko‘ring yoki «Natijani nusxalash» tugmasidan foydalaning.';snd.disabled=false;});
  };
  document.getElementById('cp').onclick=()=>{
    const t=`Kimyo, ${c.no}-mavzu: ${r.total}% — ${g[0]}\n`+Object.keys(W).map(k=>`${NAMES[k]}: ${r.comp[k].done?Math.round(r.comp[k].p*100)+'%':'—'} (${r.comp[k].txt})`).join('\n');
    const m=document.getElementById('msg');
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Nusxalandi. O‘qituvchiga yuborishingiz mumkin.').catch(()=>{m.textContent=t;m.style.whiteSpace='pre-line'});
  };
  document.getElementById('rs').onclick=()=>{delete S['m'+c.no];save();chapter(c.no,'natija');};
}
function route(){const m=location.hash.match(/^#m(\d+)$/);m?chapter(+m[1]):home();}
window.addEventListener('hashchange',()=>{try{route()}catch(e){}});try{route()}catch(e){home()}
</script>
</body>
